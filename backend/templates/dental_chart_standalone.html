{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Răng Khám Bệnh - Nha Khoa Minh Sinh</title>
    <link rel="icon" href="/static/img/logo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-white min-h-screen">
    <div id="dental-chart-root">
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                <p class="text-gray-600 font-medium">Đang tải sơ đồ răng...</p>
            </div>
        </div>
    </div>
    <script>
        (function () {
            const origFetch = window.fetch;
            function getCookie(name) {
                const match = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
                return match ? decodeURIComponent(match[2]) : '';
            }
            window.fetch = function (input, init) {
                const url = typeof input === 'string' ? input : (input && input.url) || '';
                const opts = Object.assign({}, init || {});
                const method = (opts.method || 'GET').toUpperCase();
                if (url.startsWith('/api/') && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
                    const headers = new Headers(opts.headers || {});
                    if (!headers.has('X-CSRFToken')) {
                        headers.set('X-CSRFToken', getCookie('csrftoken'));
                    }
                    opts.headers = headers;
                    if (!opts.credentials) opts.credentials = 'same-origin';
                }
                return origFetch.call(this, input, opts);
            };
        })();
    </script>
    <script src="{% static 'js/dental_chart_app.bundle.js' %}"></script>
</body>
</html>
