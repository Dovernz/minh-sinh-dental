<!DOCTYPE html>
<html lang="vi" class="dark"><head><meta charset="UTF-8"><title>Quên mật khẩu | Nha Khoa</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md border border-gray-700">
        <div class="flex justify-center mb-6"><img src="/static/img/logo.jpg" alt="Logo" class="h-16 rounded-full"></div>
        <h2 class="text-2xl font-bold mb-2 text-center text-white">Quên mật khẩu</h2>
        <p class="text-gray-400 mb-6 text-center text-sm">Nhập email của bạn để nhận liên kết đặt lại mật khẩu.</p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div><label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" name="email" required class="w-full bg-gray-900 border border-gray-700 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 text-white"></div>
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-md">Gửi liên kết</button>
        </form>
        <div class="mt-4 text-center"><a href="/admin/login/" class="text-sm text-purple-400 hover:text-purple-300">Quay lại Đăng nhập</a></div>
    </div>
</body></html>
