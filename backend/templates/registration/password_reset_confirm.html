<!DOCTYPE html>
<html lang="vi" class="dark"><head><meta charset="UTF-8"><title>Quên mật khẩu | Nha Khoa</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md border border-gray-700">
        <div class="flex justify-center mb-6"><img src="/static/img/logo.jpg" alt="Logo" class="h-16 rounded-full"></div>
        <style>
        input { width: 100%; background: #111827; border: 1px solid #374151; border-radius: 0.375rem; padding: 0.5rem; color: white; margin-bottom: 1rem;}
        input:focus { outline: none; border-color: #9333ea; }
        label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; font-weight: 500;}
        .helptext { display: block; font-size: 0.75rem; color: #9ca3af; margin-top: -0.75rem; margin-bottom: 1rem; }
        ul.errorlist { color: #f87171; font-size: 0.875rem; margin-bottom: 1rem; }
        </style>
        <h2 class="text-2xl font-bold mb-6 text-center text-white">Tạo mật khẩu mới</h2>
        {% if validlink %}
        <form method="post">{% csrf_token %} {{ form.as_p }}
        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-md mt-2">Lưu mật khẩu</button></form>
        {% else %}
        <p class="text-red-400 text-center">Liên kết này đã hết hạn. Vui lòng yêu cầu lại.</p>
        <a href="{% url 'admin_password_reset' %}" class="block w-full text-center text-purple-400 mt-4">Yêu cầu liên kết mới</a>
        {% endif %}
    </div>
</body></html>
