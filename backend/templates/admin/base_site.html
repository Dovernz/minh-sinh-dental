{% extends "unfold/layouts/base.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
/* --- TỐI ƯU KHUNG PHÂN QUYỀN --- */
.selector-available select, .selector-chosen select, select[multiple] {
    height: 60vh !important;
    min-height: 500px !important;
}
select[multiple] option {
    padding: 12px 10px !important;
    white-space: normal !important;
    line-height: 1.5 !important;
    font-size: 14px !important;
    border-bottom: 1px solid rgba(128, 128, 128, 0.2) !important;
}
.selector { display: flex !important; width: 100% !important; gap: 15px; }
.selector-available, .selector-chosen { width: 50% !important; flex: 1 !important; }
</style>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Việt hóa nút Lịch sử
    document.querySelectorAll('a, button').forEach(el => {
        if (el.textContent.includes("Bản ghi nhớ")) el.innerHTML = el.innerHTML.replace("Bản ghi nhớ", "Lịch sử thao tác");
    });

    setTimeout(function() {
        let currentPath = window.location.pathname;
        let urlParams = new URLSearchParams(window.location.search);
        let groupName = urlParams.get('group');
        
        // 1. Tự động tìm tên Nhóm từ Sidebar nếu không có tham số
        let activeLink = document.querySelector(`aside a[href="${currentPath}"]`) || document.querySelector(`aside a[href^="${currentPath}"]`);
        if (!groupName && activeLink) {
            let ul = activeLink.closest('ul');
            if (ul && ul.previousElementSibling) groupName = ul.previousElementSibling.textContent.trim();
        }

        // 2. Chế ngự Breadcrumb
        if (groupName) {
            let breadcrumbs = document.querySelectorAll('nav[aria-label="Breadcrumb"] a, nav[aria-label="Breadcrumb"] span');
            if (breadcrumbs.length >= 2) {
                let targetCrumb = breadcrumbs[1];
                let newUrl = "/admin/booking/?group=" + encodeURIComponent(groupName);
                
                if (targetCrumb.tagName === 'SPAN') {
                    let newA = document.createElement('a');
                    newA.href = newUrl;
                    newA.className = targetCrumb.className.replace('text-gray-500', 'text-primary-600 hover:text-primary-700 font-medium');
                    newA.textContent = groupName;
                    targetCrumb.parentNode.replaceChild(newA, targetCrumb);
                } else {
                    targetCrumb.href = newUrl;
                    targetCrumb.textContent = groupName;
                    targetCrumb.style.pointerEvents = 'auto';
                }
            }
        }

        // 3. Thanh trừng trang App Index (Smart Filter)
        if (currentPath === '/admin/booking/' && groupName) {
            let h1 = document.querySelector('h1');
            if (h1) h1.textContent = groupName;

            let validLinks = [];
            document.querySelectorAll('aside ul').forEach(ul => {
                if (ul.previousElementSibling && ul.previousElementSibling.textContent.trim() === groupName) {
                    ul.querySelectorAll('a').forEach(a => validLinks.push(a.getAttribute('href')));
                }
            });

            document.querySelectorAll('main a[href^="/admin/booking/"]').forEach(a => {
                let href = a.getAttribute('href');
                if (href && href !== '/admin/booking/') {
                    let isBelong = validLinks.some(valid => href === valid || href.startsWith(valid));
                    if (!isBelong) {
                        let row = a.closest('tr') || a.closest('li, div.bg-white, div.border-b');
                        if (row) row.style.display = 'none';
                    }
                }
            });
        }

        // 4. Đồng bộ Dashboard (/admin/) với Sidebar
        if (currentPath === '/admin/') {
            let appListContainers = document.querySelectorAll('main .flex.flex-col.gap-8 > div.flex.flex-col.gap-4, main #content-main');
            
            appListContainers.forEach(container => {
                let oldContent = container.innerHTML;
                container.innerHTML = '';
                
                document.querySelectorAll('aside nav > ul').forEach(ul => {
                    let groupNameElem = ul.previousElementSibling;
                    if (groupNameElem && groupNameElem.textContent.trim() && groupNameElem.textContent.trim() !== 'Lịch sử thao tác') {
                        let groupName = groupNameElem.textContent.trim();
                        let links = ul.querySelectorAll('li > a');
                        
                        if (links.length > 0) {
                            let block = document.createElement('div');
                            block.className = 'bg-white border border-gray-200 rounded-md shadow-sm overflow-hidden mb-6';
                            
                            let header = document.createElement('div');
                            header.className = 'bg-gray-50 border-b border-gray-200 px-4 py-3 text-sm font-semibold text-gray-900';
                            let headerLink = document.createElement('a');
                            headerLink.href = "/admin/booking/?group=" + encodeURIComponent(groupName);
                            headerLink.textContent = groupName;
                            headerLink.className = "hover:text-primary-600 hover:underline";
                            header.appendChild(headerLink);
                            
                            let list = document.createElement('div');
                            list.className = 'divide-y divide-gray-200';
                            
                            links.forEach(a => {
                                let item = document.createElement('div');
                                item.className = 'px-4 py-3 flex items-center justify-between hover:bg-gray-50';
                                
                                let link = document.createElement('a');
                                link.href = a.getAttribute('href');
                                link.textContent = a.textContent.trim();
                                link.className = 'text-sm font-medium text-primary-600 hover:text-primary-800';
                                
                                let addLink = document.createElement('a');
                                addLink.href = a.getAttribute('href') + "add/";
                                addLink.textContent = 'Thêm';
                                addLink.className = 'text-xs text-gray-500 hover:text-primary-600 font-medium px-2 py-1 bg-gray-100 rounded';
                                
                                item.appendChild(link);
                                item.appendChild(addLink);
                                list.appendChild(item);
                            });
                            
                            block.appendChild(header);
                            block.appendChild(list);
                            container.appendChild(block);
                        }
                    }
                });
            });
        }
    }, 150);
});
</script>
{% endblock %}
