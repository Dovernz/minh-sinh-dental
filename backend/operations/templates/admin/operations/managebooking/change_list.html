{% extends "admin/change_list.html" %}

{% block content %}
<div id="qrModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
    <div style="background-color: #fff; margin: 10% auto; padding: 20px; border: 1px solid #888; width: 300px; text-align: center; border-radius: 8px;">
        <h3>Mã QR Thanh Toán</h3>
        <img id="qrImage" src="" alt="Mã QR" style="max-width: 100%; height: auto; margin-bottom: 20px;" />
        <div>
            <button type="button" id="closeQrModal" class="button" style="background-color: #79aec8; margin-right: 10px;">Thoát</button>
            <button type="button" id="confirmQrPaid" class="button default">Xác nhận Đã thu tiền</button>
        </div>
    </div>
</div>

{{ block.super }}
{% endblock %}
