{% extends "admin/import_export/import.html" %}
{% load i18n %}

{% block import_hints %}
    {{ block.super }}
    <div style="margin-bottom: 20px;">
        <a href="../import-template/" class="button" style="background-color: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px;">Tải File Excel Mẫu</a>
        <p class="help">Tải file mẫu để đảm bảo có đầy đủ các cột hợp lệ trước khi Import.</p>
    </div>
{% endblock %}

{% block content %}
    {{ block.super }}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var fileInput = document.querySelector('input[type="file"]');
            var formatSelect = document.getElementById('id_format');
            
            if (fileInput && formatSelect) {
                var fileNameSpan = document.createElement('span');
                fileNameSpan.style.marginLeft = '10px';
                fileNameSpan.style.fontWeight = 'bold';
                fileNameSpan.style.color = '#28a745';
                
                fileInput.parentNode.insertBefore(fileNameSpan, fileInput.nextSibling);
                
                fileInput.addEventListener('change', function(event) {
                    if (event.target.files.length > 0) {
                        fileNameSpan.textContent = 'Đã chọn: ' + event.target.files[0].name;
                    } else {
                        fileNameSpan.textContent = '';
                    }
                });

                function updateAcceptFormat() {
                    // formats = [XLSX, CSV] => index 0 is XLSX, index 1 is CSV
                    var selectedFormat = formatSelect.value;
                    if (selectedFormat === '0') {
                        fileInput.setAttribute('accept', '.xlsx, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
                    } else if (selectedFormat === '1') {
                        fileInput.setAttribute('accept', '.csv');
                    } else {
                        fileInput.removeAttribute('accept');
                    }
                }
                
                formatSelect.addEventListener('change', updateAcceptFormat);
                updateAcceptFormat(); // Call once on load
            }
        });
    </script>
{% endblock %}
